  maande,<br>
       seisoene,<br>
             jare...<br>
  vergestalt in konsentriese sirkels<br>
  rimpelings in ruimte-tyd<br>
  wat uitkring uit die Self
</p>

<p>
  so weerklink &quot;Ek Is&quot;<br>
        uit wat is<br>
  en vorm in aar en grein,<br>
        in letsel en knoets<br>
  wat moet wees
</p></div><nav class="poem-back" aria-label="Nog gedigte"><a href="../index.html">← Nog Gedigte</a></nav></div></div></body></html>
