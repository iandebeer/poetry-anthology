<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Poem</title><style>html,body{min-height:100%;margin:0}body{font-family:serif;line-height:1.6;color:#1a1a20;background-color:#e8e8ec;display:flex;position:relative}.poem-split-wrap{display:flex;flex-direction:row;flex:1;width:100%;min-height:100vh;align-items:flex-start}.poem-split-img{display:block;width:42vw;max-width:520px;min-width:180px;height:auto;flex-shrink:0;object-fit:contain;object-position:top center;align-self:flex-start}.poem-content{position:relative;z-index:1;flex:1;max-width:none;padding:2rem 2.5rem;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;min-height:100vh}.lang-block{margin-bottom:2rem}h1{font-size:1.25rem}h3{font-size:0.9rem;color:#555}p{margin:0.5rem 0}.poem-audio-wrap{margin-top:1.5rem;width:100%;max-width:28rem}.poem-audio{display:block;width:100%;height:2.5rem}@media (max-width:640px){.poem-split-wrap{flex-direction:column}.poem-split-img{width:100%;max-width:none;height:auto}}.poem-content{background-color:rgb(234,234,233);border-radius:0}</style></head><body><div class="poem-split-wrap"><img class="poem-split-img" src="media/o-image.png" alt="" /><div class="poem-content"><h1>Mag jou jeug weer nuut word...</h1>

<p>
  Mag jou jeug weer nuut word soos die van 'n arend -<br>
  een veer per vlerk, twee op 'n slag;<br>
  want steeds ry jy die wind<br>
  om jou prooi te kan jag.
</p>

<p>
  Mag die goeie jou siel versadig<br>
  en vrede vind wyl jy wag,<br>
  want jonk word neem sy tyd -<br>
  een veer per vlerk, twee op 'n slag.
</p></div></div></body></html>
