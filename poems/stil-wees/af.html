<body>
<h1>Stil wees</h1>

<p>
  As ek my oë sou opslaan na die berge<br>
  en durf wonder waar my hulp van kom;<br>
  of soos Elia my in 'n grot dalks<br>
  wagting op 'n helpende hand;<br>
  sal ek nog in wind,<br>
  of aard, of vuur wat brand,<br>
  antwoord op my soeke vind -<br>
  maar die in stilte...<br>
  die stilte, wat als omvat:<br>
  Hari Om Tat Sat
</p>
