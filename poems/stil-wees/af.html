<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Poem</title><style>html,body{min-height:100%;margin:0}body{font-family:serif;line-height:1.6;color:#1a1a20;background-color:#e8e8ec;display:flex;position:relative}.poem-split-wrap{display:flex;flex-direction:row;flex:1;width:100%;min-height:100vh;align-items:stretch}.poem-split-img{display:block;width:42vw;max-width:520px;min-width:180px;flex-shrink:0;object-fit:cover;object-position:center}.poem-content{position:relative;z-index:1;flex:1;max-width:none;padding:2rem 2.5rem;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center}.lang-block{margin-bottom:2rem}h1{font-size:1.25rem}h3{font-size:0.9rem;color:#555}p{margin:0.5rem 0}.poem-audio-wrap{margin-top:1.5rem;width:100%;max-width:28rem}.poem-audio{display:block;width:100%;height:2.5rem}@media (max-width:640px){.poem-split-wrap{flex-direction:column}.poem-split-img{width:100%;max-width:none;height:38vh;min-height:160px}}.poem-content{background-color:rgb(238,240,243);border-radius:0}</style></head><body><div class="poem-split-wrap"><img class="poem-split-img" src="media/o-image.png" alt="" /><div class="poem-content"><h1>Stil wees</h1>

<p>
  As ek my oë sou opslaan na die berge<br>
  en durf wonder waar my hulp van kom;<br>
  of soos Elia my in 'n grot dalks<br>
  wagting op 'n helpende hand;<br>
  sal ek nog in wind,<br>
  of aard, of vuur wat brand,<br>
  antwoord op my soeke vind -<br>
  maar die in stilte...<br>
  die stilte, wat als omvat:<br>
  Hari Om Tat Sat
</p></div></div></body></html>
