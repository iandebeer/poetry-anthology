<body>
<h1>the unborn I</h1>

<p>
  the moment the first man draws his breath<br>
  and the last man's breath fades like the wind,<br>
  is the same moment I<br>
  in shape and feeling,<br>
  in perception and projection<br>
  manifest as awareness.
</p>

<p>
  and between my in- and outbreath—<br>
  empty of self<br>
  I can again turn to nothing.
</p>
