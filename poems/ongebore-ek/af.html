  <meta charset="utf-8">
  <title>Poem</title>
</head>
<body>
<h1>die ongebore ek</h1>

<p>
  die oomblik waarin die eerste mens sy asem teug<br>
  en  laaste mens se asem word soos wind,<br>
  is die selfde oomblik waarin ek<br>
  in vorm en gevoel,<br>
  in waarneming en  projeksie<br>
  as bewustheid manifesteer
</p>

<p>
  en tussen my in- en uitasem<br>
  — leeg van self<br>
  weer tot niks kan  keer.
</p>
</body>
</html>
