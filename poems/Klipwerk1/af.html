<h1>Klipwerk</h1>

<p>
  Duskant die leegheid,<br>
  lank voor die heelheid,<br>
  lê vorm:<br>
  vloei, gestol in die oomblik;<br>
  net om te morfeer onder beitel en vyl<br>
  tot ’n uitbeelding, die vergestalting —<br>
  ván doel as betekenis —<br>
  gedagte geëtst in die ewige.
</p>

<p>
  (opgedra aan David Steele)
</p>
