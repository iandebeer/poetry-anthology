<h1>Stonework</h1>

<p>
  Beyond the emptiness,<br>
  long before the wholeness,<br>
  lies form:<br>
  flow, frozen in the moment;<br>
  merely to be shaped beneath chisel and file<br>
  into a figure, the embodiment —<br>
  of purpose as meaning —<br>
  thought etched in the eternal.
</p>

<p>
  (dedicated to David Steele)
</p>
