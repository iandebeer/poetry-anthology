  This side of the void,<br>
  long before unity,<br>
  lies form:<br>
  flow coagulated in the moment;<br>
  just to morph under chisel and file<br>
  as a representation, the manifestation<br>
  of purpose as meaning —<br>
  a thought etched in the eternal.
</p>

<p>
  (dedicated to David Steele)
</p></div><nav class="poem-back poem-back-bottom" aria-label="Nog gedigte"><a href="../index.html">← Nog Gedigte</a></nav></div></div></body></html>
